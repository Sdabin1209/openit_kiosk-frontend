<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문진 키오스크</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="kiosk.css">
</head>
<body>
<main id="app">
  <h1 id="title" aria-live="polite"></h1>
  <ol id="chat" class="chat" role="log" aria-live="polite" aria-relevant="additions" hidden></ol>
</main>
<footer id="controls">
  <div id="manual" hidden>
    <label id="manual-label" for="manual-input"></label>
    <input id="manual-input" type="text" autocomplete="off">
  </div>
  <button id="action" type="button"></button>
  <button id="extend" type="button" hidden></button>
  <button id="staffcall" type="button" hidden></button>
  <button id="secondary" type="button" hidden></button>
  <p id="countdown" aria-hidden="true" hidden></p>
  <p id="notice" role="status"></p>
</footer>
<script src="kiosk.js"></script>
</body>
</html>
