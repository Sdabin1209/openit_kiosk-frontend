<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문진 키오스크</title>
<link rel="stylesheet" href="kiosk.css">
</head>
<body>
<main id="app" aria-live="polite">
  <h1 id="title"></h1>
  <p id="text"></p>
  <div id="manual" hidden>
    <label id="manual-label" for="manual-input"></label>
    <input id="manual-input" type="text" autocomplete="off">
  </div>
  <button id="action" type="button"></button>
  <button id="staffcall" type="button" hidden></button>
  <button id="secondary" type="button" hidden></button>
  <p id="countdown" aria-hidden="true" hidden></p>
  <p id="notice" role="status"></p>
</main>
<ol id="chat" class="chat" aria-live="off" hidden></ol>
<script src="kiosk.js"></script>
</body>
</html>
